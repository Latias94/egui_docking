[package]
name = "egui-native-smoke"
description = "One-shot real-window smoke for egui_dockspace_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
workspace = "../egui-fork-workspace"

[dependencies]
dockspace = { path = "../../crates/dockspace", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "native-host-seam", "x11"] }
egui_inspection = { git = "https://github.com/Latias94/egui", rev = "9729e354a1985cd9d8bbc7ca6306c68656635e06", default-features = false, features = ["plugin"] }
egui_dockspace = { path = "../../crates/egui_dockspace", default-features = false, features = ["native-render-support"] }
egui_dockspace_native = { path = "../../crates/egui_dockspace_native" }
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[[bin]]
name = "egui-native-physical-smoke"
path = "src/bin/physical_x11.rs"

[[bin]]
name = "egui-native-output-pressure"
path = "src/bin/output_pressure.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
