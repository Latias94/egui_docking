[workspace]
resolver = "3"

[package]
name = "egui-dockspace-product-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
dockspace = { path = "../../crates/dockspace", features = ["serde"] }
egui = { version = "=0.36.1", default-features = false, features = ["default_fonts"] }
egui_dockspace = { path = "../../crates/egui_dockspace", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
