[workspace]
resolver = "3"

[package]
name = "egui-dockspace-fork-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }
egui_dockspace = { path = "../../crates/egui_dockspace" }
egui_dockspace_native = { path = "../../crates/egui_dockspace_native" }

[patch.crates-io]
ecolor = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
eframe = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
egui = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
egui-wgpu = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
egui-winit = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
egui_glow = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
emath = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
epaint = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
epaint_default_fonts = { git = "https://github.com/Latias94/egui", rev = "66920b0de76f84503145a3c8e0eabc0b65666413" }
winit = { git = "https://github.com/Latias94/winit", rev = "bc2d69433d733d113f7b0b507fe060d62f30b7d1" }

[lints.rust]
unsafe_code = "forbid"
