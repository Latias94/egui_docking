[workspace]
resolver = "3"

[package]
name = "egui-dockspace-fork-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }
egui_dockspace = { path = "../../crates/egui_dockspace" }
egui_dockspace_native = { path = "../../crates/egui_dockspace_native" }

[patch.crates-io]
ecolor = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
eframe = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
egui = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
egui-wgpu = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
egui-winit = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
egui_glow = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
emath = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
epaint = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
epaint_default_fonts = { git = "https://github.com/Latias94/egui", rev = "20b35b03d645bc3cab68f7b26eee6be8fbc40ef0" }
winit = { git = "https://github.com/Latias94/winit", rev = "ae4e6c5ee0af4b68c4ea1c2a2763b97e3ab7ae4c" }

[lints.rust]
unsafe_code = "forbid"
