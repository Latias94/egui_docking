[workspace]
resolver = "3"

[profile.production]
inherits = "release"
lto = "thin"
codegen-units = 1

[package]
name = "egui-dockspace-official-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = []
demo = ["egui_dockspace/wgpu"]
motion = ["egui_dockspace/motion"]

[dependencies]
dockspace = { path = "../../crates/dockspace", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui_dockspace = { path = "../../crates/egui_dockspace", default-features = false }

[[bin]]
name = "workbench"
path = "../../crates/egui_dockspace/examples/workbench.rs"
required-features = ["demo"]

[lints.rust]
unsafe_code = "forbid"
