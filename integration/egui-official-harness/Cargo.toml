[workspace]
resolver = "3"

[profile.production]
inherits = "release"
lto = "thin"
codegen-units = 1

[package]
name = "egui-dockspace-official-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = []
demo = [
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:pollster",
    "dep:winit",
]

[dependencies]
dockspace = { path = "../../crates/dockspace", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui_dockspace = { path = "../../crates/egui_dockspace", default-features = false }
egui-wgpu = { version = "=0.37.0", optional = true, features = ["winit", "wayland", "x11"] }
egui-winit = { version = "=0.37.0", optional = true, default-features = false, features = ["wayland", "x11"] }
pollster = { version = "0.4.0", optional = true }
winit = { version = "=0.30.13", optional = true }

[[bin]]
name = "official-caller-owned-demo"
path = "src/bin/official_caller_owned_demo.rs"
required-features = ["demo"]

[lints.rust]
unsafe_code = "forbid"
