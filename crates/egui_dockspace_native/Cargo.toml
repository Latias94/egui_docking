[workspace]
resolver = "3"

[package]
name = "egui_dockspace_native"
description = "Unpublished fork-backed native runtime for egui_dockspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/egui_docking"
publish = false

[dependencies]
dockspace = { path = "../dockspace", default-features = false }
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "=0.35.0", default-features = false }
egui_dockspace = { path = "../egui_dockspace", features = ["serde"] }
thiserror = "2.0.18"

[patch.crates-io]
ecolor = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
eframe = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
egui = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
egui-wgpu = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
egui-winit = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
egui_glow = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
emath = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
epaint = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
epaint_default_fonts = { git = "https://github.com/Latias94/egui", rev = "e235606724964c26c280792c16a0e2e3c90c6acb" }
winit = { git = "https://github.com/Latias94/winit", rev = "ae4e6c5ee0af4b68c4ea1c2a2763b97e3ab7ae4c" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[example]]
name = "native_multiview"
path = "examples/native_multiview.rs"
