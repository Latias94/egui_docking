[package]
name = "egui_dockspace_native"
description = "Unpublished fork-backed native runtime for egui_dockspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
workspace = "../../integration/egui-fork-workspace"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/egui_docking"
publish = false

[dependencies]
dockspace = { path = "../dockspace", default-features = false }
egui_dockspace = { path = "../egui_dockspace", default-features = false, features = ["native-render-support"] }
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "native-host-seam", "wayland", "x11"] }
thiserror = "2.0.18"
winit = { version = "=0.30.13", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
