[package]
name = "dockspace_winit"
description = "Window input and repaint helpers for winit-based dockspace hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
example-app = ["dep:font8x8", "dep:softbuffer"]

[dependencies]
dockspace.workspace = true
font8x8 = { version = "0.3.1", optional = true }
softbuffer = { version = "0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit.workspace = true

[[example]]
name = "software"
required-features = ["example-app"]
test = true

[lints]
workspace = true
