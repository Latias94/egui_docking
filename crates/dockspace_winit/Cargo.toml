[package]
name = "dockspace_winit"
description = "Input, repaint and optional native-window integration for winit-based dockspace hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["rwh_06", "x11", "wayland", "wayland-csd-adwaita"]
rwh_06 = ["winit/rwh_06"]
x11 = ["winit/x11", "softbuffer?/x11", "softbuffer?/x11-dlopen"]
wayland = ["winit/wayland", "winit/wayland-dlopen", "softbuffer?/wayland", "softbuffer?/wayland-dlopen"]
wayland-csd-adwaita = ["wayland", "winit/wayland-csd-adwaita"]
native = ["native-windows", "native-geometry"]
native-windows = []
native-geometry = ["dep:thiserror"]
example-app = ["dep:font8x8", "dep:softbuffer", "rwh_06"]

[dependencies]
dockspace.workspace = true
font8x8 = { version = "0.3.1", optional = true }
softbuffer = { version = "0.4.8", optional = true, default-features = false }
thiserror = { workspace = true, optional = true }
winit.workspace = true

[[example]]
name = "software"
required-features = ["example-app"]
test = true

[[example]]
name = "multiview"
required-features = ["native-windows", "native-geometry", "example-app"]
test = true

[lints]
workspace = true
