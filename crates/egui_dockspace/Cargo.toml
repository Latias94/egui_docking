[package]
name = "egui_dockspace"
description = "Deterministic single-surface docking adapter for egui"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
backend = ["dockspace/backend"]
example-app = ["dep:eframe"]
serde = ["backend", "dockspace/serde", "dep:serde_json"]
# Internal seam consumed by the unpublished fork-backed native adapter. This
# deliberately exposes only sessionless paint/measurement helpers; it does not
# create or own a docking session.
native-render-support = []

[dependencies]
dockspace = { workspace = true, default-features = false }
eframe = { workspace = true, optional = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
dockspace = { workspace = true, features = ["backend"] }
egui = { workspace = true, features = ["default_fonts"] }

[[example]]
name = "basic"
required-features = ["example-app"]

[[example]]
name = "workspace_persistence"
required-features = ["example-app", "serde"]

[[test]]
name = "contained_occlusion"

[[test]]
name = "tear_off_mode"

[lints]
workspace = true
