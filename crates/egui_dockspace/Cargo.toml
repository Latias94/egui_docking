[package]
name = "egui_dockspace"
description = "Deterministic single-surface docking adapter for egui"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
example-app = ["dep:eframe"]
example-wgpu = ["dep:egui-wgpu", "dep:egui-winit", "dep:pollster", "dep:winit", "egui/default_fonts"]
serde = ["dockspace/serde"]
# Internal seam consumed by the unpublished fork-backed native adapter. This
# deliberately exposes only sessionless paint/measurement helpers; it does not
# create or own a docking session.
native-render-support = []

[dependencies]
dockspace = { workspace = true, default-features = false }
eframe = { workspace = true, optional = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui.workspace = true
egui-wgpu = { version = "=0.37.0", optional = true, features = ["winit", "wayland", "x11"] }
egui-winit = { version = "=0.37.0", optional = true, default-features = false, features = ["wayland", "x11"] }
pollster = { version = "0.4.0", optional = true }
thiserror.workspace = true
winit = { version = "=0.30.13", optional = true }

[dev-dependencies]
dockspace = { workspace = true, default-features = false }
dockspace_host_conformance = { path = "../dockspace_host_conformance" }
egui = { workspace = true, features = ["default_fonts"] }

[[example]]
name = "workbench"
required-features = ["example-wgpu"]
test = true

[[example]]
name = "basic"
required-features = ["example-app"]
test = true

[[example]]
name = "background_save"
required-features = ["example-app"]
test = true

[[example]]
name = "workspace_persistence"
required-features = ["example-app", "serde"]
test = true

[[test]]
name = "contained_occlusion"

[[test]]
name = "tear_off_mode"

[[test]]
name = "tab_accessibility"

[lints]
workspace = true
