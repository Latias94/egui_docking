[package]
name = "egui_dockspace"
description = "Deterministic single-surface docking adapter for egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["motion", "x11", "wayland", "wayland-csd-adwaita"]
example-app = ["dep:eframe", "dep:winit"]
winit = ["dep:dockspace_winit", "dep:egui-winit", "dep:winit"]
wgpu = ["winit", "dep:egui-wgpu", "dep:pollster", "egui/default_fonts"]
accesskit = ["winit", "egui-winit/accesskit"]
x11 = ["dockspace_winit?/x11", "egui-winit?/x11", "egui-wgpu?/x11", "eframe?/x11", "winit?/x11"]
wayland = ["dockspace_winit?/wayland", "egui-winit?/wayland", "egui-wgpu?/wayland", "eframe?/wayland", "winit?/wayland", "winit?/wayland-dlopen"]
wayland-csd-adwaita = ["wayland", "dockspace_winit?/wayland-csd-adwaita", "winit?/wayland-csd-adwaita"]
serde = ["dockspace/serde"]
motion = ["dockspace/motion"]
# Internal seam consumed by the unpublished fork-backed native adapter. This
# deliberately exposes only sessionless paint/measurement helpers; it does not
# create or own a docking session.
native-render-support = []

[dependencies]
dockspace = { workspace = true, default-features = false }
dockspace_winit = { workspace = true, optional = true, default-features = false }
eframe = { workspace = true, optional = true, features = ["default_fonts", "glow"] }
egui.workspace = true
egui-wgpu = { version = "=0.37.0", optional = true, features = ["winit"] }
egui-winit = { version = "=0.37.0", optional = true, default-features = false, features = ["clipboard", "links"] }
pollster = { version = "1.0.1", optional = true }
thiserror.workspace = true
winit = { workspace = true, optional = true, features = ["rwh_06"] }

[dev-dependencies]
dockspace = { workspace = true, default-features = false }
dockspace_host_conformance = { path = "../dockspace_host_conformance" }
egui = { workspace = true, features = ["default_fonts"] }
tempfile = "3.23.0"

[[example]]
name = "workbench"
required-features = ["wgpu"]
test = true

[[example]]
name = "winit"
required-features = ["wgpu"]
test = false

[[example]]
name = "basic"
required-features = ["example-app"]
test = true

[[example]]
name = "background_save"
required-features = ["example-app"]
test = true

[[example]]
name = "workspace_persistence"
required-features = ["example-app", "serde"]
test = true

[lints]
workspace = true
