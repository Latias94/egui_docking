[workspace]
resolver = "3"
members = ["crates/dockspace", "crates/egui_dockspace"]
exclude = ["integration/egui-fork-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/egui_docking"

[workspace.dependencies]
dockspace = { version = "0.1.0", path = "crates/dockspace", default-features = false }
egui = { version = "0.35.0", default-features = false }
eframe = { version = "0.35.0", default-features = false }
proptest = "1.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slotmap = "1.1.1"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
