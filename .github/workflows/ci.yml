name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Format
        run: cargo fmt --all --check
      - name: Check correctness lints
        run: >-
          cargo clippy --workspace --all-features --all-targets --locked --
          -A warnings -D clippy::correctness -D clippy::suspicious
      - name: Build strict documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --package dockspace --package egui_dockspace
          --all-features --no-deps --locked
      - name: Run workspace tests
        run: >-
          cargo nextest run --workspace --all-features --all-targets
          --no-fail-fast --locked
      - name: Run documentation tests
        run: cargo test --doc --workspace --all-features --locked

  official-egui:
    name: Official egui consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: official-egui

      - name: Run downstream public API harness
        run: >-
          cargo test --manifest-path integration/egui-official-harness/Cargo.toml
          --locked
